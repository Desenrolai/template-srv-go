version: "2"

linters:
  default: standard
  enable:
    # Erro embrulhado sem %w quebra errors.Is/As silenciosamente.
    - errorlint
    # Corpo de resposta HTTP não fechado vaza conexão.
    - bodyclose
    - misspell
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
