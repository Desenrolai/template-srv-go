name: CI

# `push` só na branch default; todo o resto é coberto por `pull_request`.
#
# Com `push: ["**"]` e `pull_request` juntos, cada commit de uma branch com PR
# aberto dispara DOIS runs completos do mesmo SHA. O `concurrency` abaixo NÃO
# deduplica: a chave usa `github.ref`, que é `refs/heads/<branch>` no push e
# `refs/pull/<n>/merge` no pull_request — grupos diferentes, zero cancelamento.
# Medido em repo gerado: o mesmo SHA com um run `success` e outro `failure`.
#
# Remover `pull_request` também mataria a duplicação, mas deixaria PR de fork sem
# CI nenhum (o push do fork não dispara no repo base) — e este template é público.
# Fixado por teste: internal/ciwiring/ci_wiring_test.go
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  REGISTRY: ghcr.io
  IMAGE_NAME: desenrolai/${{ github.event.repository.name }}

jobs:
  lint:
    name: Lint
    # Runner parametrizado: sem a variável de repositório, cai no runner hospedado.
    # `fromJSON` porque um runner self-hosted é um *conjunto* de labels — uma string
    # com vírgula viraria um único label chamado "self-hosted,desenrolai".
    # Ver README, seção "Repo privado: o CI nasce morto sem estas variáveis".
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: Build & Test
    # Runner parametrizado: sem a variável de repositório, cai no runner hospedado.
    # `fromJSON` porque um runner self-hosted é um *conjunto* de labels — uma string
    # com vírgula viraria um único label chamado "self-hosted,desenrolai".
    # Ver README, seção "Repo privado: o CI nasce morto sem estas variáveis".
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

  # Fora da branch padrão a imagem é só construída: sem login no GHCR e sem
  # `packages: write`. Sem este job, um Dockerfile quebrado atravessaria o PR
  # inteiro verde e só apareceria depois do merge.
  docker-build:
    name: Docker Build (PR)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_DOCKER || '"ubuntu-latest"') }}
    needs: [lint, test]
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (sem push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker:
    name: Docker Build & Push
    runs-on: ${{ fromJSON(vars.CI_RUNNER_DOCKER || '"ubuntu-latest"') }}
    needs: [lint, test]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      # Só o push da imagem precisa escrever no GHCR.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.repository.default_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
